name: follow upstream

# Ours is a fork with one change of our own on `keep-to-the-script`. This keeps
# `master` the same as theirs and carries our change onto it every day, so that
# the day their code moves under ours we hear it from a failed run rather than
# from a build that will not compile months later.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  follow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Take their master
        run: |
          git remote add upstream https://github.com/k2-fsa/sherpa-onnx.git
          git fetch upstream master
          git checkout master
          git merge --ff-only upstream/master
          git push origin master

      - name: Carry ours onto it
        id: carry
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout keep-to-the-script
          if git rebase master; then
            git push --force-with-lease origin keep-to-the-script
            echo "carried=yes" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "carried=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Say so when it no longer fits
        if: steps.carry.outputs.carried == 'no'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Our change no longer sits on their master';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream',
            });
            if (open.data.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['upstream'],
              body: 'Rebasing `keep-to-the-script` onto `master` stopped on a conflict. '
                  + 'Their code moved under ours; carry it across by hand.',
            });
