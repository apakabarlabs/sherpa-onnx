name: apakabarlabs build

# Builds what our own projects install: one Android library and one Python
# wheel per Python we run, both from `keep-to-the-script`. Every run leaves
# them on a release named after the commit, so a project pins a URL rather
# than a machine that happened to have a compiler that day.

on:
  push:
    branches: [keep-to-the-script]
  workflow_dispatch:

permissions:
  contents: write

# A run whose result nobody waits for any more is cancelled rather than paid for:
# the next push to this branch makes the one before it obsolete.
concurrency:
  group: apakabarlabs-build
  cancel-in-progress: true

env:
  # What tells our build apart from the published one of the same number. pip
  # compares versions and nothing else, so two builds sharing a number means a
  # swap in either direction is read as "already satisfied" and never happens.
  LOCAL_VERSION: .post1+keeptothescript

  # Built the shape the published one is built in: the bindings alone, taking the
  # runtime libraries from `sherpa-onnx-core` rather than carrying copies. Those
  # copies land on paths that package owns, and removing ours then takes its files
  # with them, leaving a package that claims to be installed and cannot load.
  SHERPA_ONNX_SPLIT_PYTHON_PACKAGE: '1'

jobs:
  android:
    name: Android library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: keep-to-the-script

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the native libraries
        shell: bash
        run: |
          export SHERPA_ONNX_ENABLE_TTS=OFF
          export SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF
          export ANDROID_NDK=${ANDROID_NDK_LATEST_HOME}
          ./build-android-arm64-v8a.sh

      - name: Put them where the library is assembled
        shell: bash
        run: |
          mkdir -p android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs/arm64-v8a
          cp -v build-android-arm64-v8a/install/lib/*.so \
            android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs/arm64-v8a/

      - name: Assemble
        shell: bash
        run: |
          cd android/SherpaOnnxAar
          ./gradlew :sherpa_onnx:assembleRelease
          cp ./sherpa_onnx/build/outputs/aar/sherpa_onnx-release.aar \
            ../../sherpa-onnx-keep-to-the-script.aar

      - uses: actions/upload-artifact@v4
        with:
          name: android-library
          path: ./*.aar

  # Built inside manylinux rather than on the runner: a wheel takes the C library
  # of the machine that compiled it, and a runner newer than the server produces
  # one that will not load there. AlmaLinux 8 carries glibc 2.28, old enough for
  # everything we run on.
  wheel-linux:
    name: Python wheel, Linux
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: keep-to-the-script

      - name: Build
        shell: bash
        env:
          SHERPA_ONNX_LOCAL_VERSION: ${{ env.LOCAL_VERSION }}
        run: |
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          python -m pip install --upgrade pip setuptools wheel cmake
          python setup.py bdist_wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  wheel-macos:
    name: Python wheel, macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: keep-to-the-script

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        shell: bash
        env:
          SHERPA_ONNX_LOCAL_VERSION: ${{ env.LOCAL_VERSION }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py bdist_wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: dist/*.whl

  # What a check on a Mac hears with. The app on a phone runs the library above; the
  # check that says whether a recording comes back word for word runs off the phone,
  # and until this was built it could only be run against upstream's release, which is
  # not the code the phone runs.
  jvm-macos:
    name: JVM library, macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: keep-to-the-script

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the native library
        shell: bash
        run: |
          mkdir build
          cd build
          cmake \
            -D BUILD_SHARED_LIBS=ON \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D SHERPA_ONNX_ENABLE_JNI=ON \
            -D SHERPA_ONNX_ENABLE_TTS=OFF \
            -D SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF \
            -D CMAKE_INSTALL_PREFIX=./install \
            ..
          make -j3
          make install

      - name: Put the native library where the archive is assembled
        shell: bash
        run: |
          dst=sherpa-onnx/java-api/resources/sherpa-onnx/native/osx-aarch64
          mkdir -p $dst
          cp -v build/install/lib/libonnxruntime.dylib $dst/
          cp -v build/install/lib/libsherpa-onnx-jni.dylib $dst/

      - name: Assemble both archives
        shell: bash
        run: |
          version=$(grep SHERPA_ONNX_VERSION CMakeLists.txt | cut -d ' ' -f 2 | cut -d '"' -f 2)
          ours=$version${LOCAL_VERSION//+/-}
          cd sherpa-onnx/java-api
          mvn package
          cp -v target/sherpa-onnx-jvm-$version.jar ../../sherpa-onnx-jvm-$ours.jar
          jar cfv ../../sherpa-onnx-native-lib-osx-aarch64-$ours.jar -C ./resources .

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-macos
          path: ./*.jar

  release:
    name: Release what was built
    needs: [android, jvm-macos, wheel-linux, wheel-macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keep-to-the-script-${{ github.sha }}
          name: keep-to-the-script ${{ github.sha }}
          body: |
            Built from `keep-to-the-script`: a NeMo transducer can be told the
            alphabet the speech is read in, and stays inside it.
          files: built/**/*
